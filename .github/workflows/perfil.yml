name: actualizar perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días, 1:00 a. m. en Bogotá
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["scripts/**", ".github/workflows/perfil.yml"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG
        run: python scripts/generar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m 'chore: actualizar estadísticas del perfil'
            git push
          fi
